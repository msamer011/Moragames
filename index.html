<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مغامرات مراد</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lalezar|Baloo+Bhaijaan+2:500,700,800&amp;subset=arabic&amp;display=swap">
<style>
/* Legacy-safe build for 2015-era TV browsers: no CSS variables, no flex/grid/gap, no JS beyond ES5.
   Everything lives on one fixed 16:9 stage (100rem x 56.25rem) whose rem is set from the window size. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
html{font-size:9px}
body{background:#DDF7FF;color:#26295A;font-family:'Baloo Bhaijaan 2',Tahoma,Arial,sans-serif;font-size:3rem}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;outline:none}
svg{display:block}
em{font-style:normal}

/* ---------- backdrop ---------- */
.world{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;background:#BDEBFF;background:linear-gradient(#49BDF5,#DDF7FF 72%)}
.sun{position:absolute;top:5rem;right:9rem;width:11rem;height:11rem;border-radius:50%;background:#FFD23F;box-shadow:0 0 0 2rem rgba(255,230,120,.35),0 0 0 4.5rem rgba(255,230,120,.2)}
.cloud{position:absolute;left:0;height:4rem;width:12rem;background:#fff;border-radius:4rem;-webkit-animation:drift linear infinite;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:6rem;height:6rem;left:1.5rem;top:-3rem}
.cloud:after{width:4.6rem;height:4.6rem;right:2rem;top:-2rem}
.c1{top:10rem;-webkit-animation-duration:80s;animation-duration:80s;-webkit-animation-delay:-30s;animation-delay:-30s}
.c2{top:22rem;-webkit-animation-name:driftb;animation-name:driftb;-webkit-animation-duration:110s;animation-duration:110s;-webkit-animation-delay:-70s;animation-delay:-70s}
.c3{top:5rem;-webkit-animation-name:driftc;animation-name:driftc;-webkit-animation-duration:95s;animation-duration:95s;-webkit-animation-delay:-10s;animation-delay:-10s}
.hill{position:absolute;border-radius:50%}
.h1{left:-12%;bottom:-27%;width:75%;height:55%;background:#86E08F}
.h2{right:-18%;bottom:-30%;width:90%;height:50%;background:#4CC873}
.grass{position:absolute;left:0;bottom:0;width:100%;height:6%;background:#4CC873}
@keyframes drift{from{-webkit-transform:translateX(-25rem);transform:translateX(-25rem)}to{-webkit-transform:translateX(150vw);transform:translateX(150vw)}}
@-webkit-keyframes drift{from{-webkit-transform:translateX(-25rem)}to{-webkit-transform:translateX(150vw)}}
@keyframes driftb{from{-webkit-transform:translateX(-25rem) scale(.7);transform:translateX(-25rem) scale(.7)}to{-webkit-transform:translateX(150vw) scale(.7);transform:translateX(150vw) scale(.7)}}
@-webkit-keyframes driftb{from{-webkit-transform:translateX(-25rem) scale(.7)}to{-webkit-transform:translateX(150vw) scale(.7)}}
@keyframes driftc{from{-webkit-transform:translateX(-25rem) scale(.55);transform:translateX(-25rem) scale(.55)}to{-webkit-transform:translateX(150vw) scale(.55);transform:translateX(150vw) scale(.55)}}
@-webkit-keyframes driftc{from{-webkit-transform:translateX(-25rem) scale(.55)}to{-webkit-transform:translateX(150vw) scale(.55)}}

/* ---------- stage ---------- */
#stage{position:fixed;left:0;top:0;width:100rem;height:56.25rem;direction:rtl;overflow:hidden}
.screen,.play,.overlay{position:absolute;left:0;top:0;width:100rem;height:56.25rem}
.screen{display:none}
.screen.on{display:block;-webkit-animation:fadein .35s;animation:fadein .35s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@-webkit-keyframes fadein{from{opacity:0}to{opacity:1}}

.round{position:absolute;width:6rem;height:6rem;border-radius:50%;background:#fff;color:#7B5CFF;box-shadow:0 .5rem 0 #C9D5F5}
.round svg{position:absolute;left:1.3rem;top:1.3rem;width:3.4rem;height:3.4rem}
.starcount{position:absolute;left:3rem;top:2rem;height:6rem;padding:0 2.2rem 0 5.8rem;background:#fff;border-radius:3rem;box-shadow:0 .5rem 0 #C9D5F5;font-size:3.2rem;font-weight:800;line-height:6rem;direction:rtl}
.starcount svg{position:absolute;left:1.4rem;top:1.2rem;width:3.6rem;height:3.6rem}
.pips{position:absolute;left:0;top:3.9rem;width:100rem;text-align:center;font-size:0;line-height:0}
.pip{display:inline-block;width:2.2rem;height:2.2rem;border-radius:50%;margin:0 .55rem;background:rgba(255,255,255,.7);border:.3rem solid #fff}
.pip.on{background:#FFD23F;box-shadow:0 0 1.4rem 0 #FFD23F}

.f{-webkit-transition:-webkit-transform .15s,box-shadow .15s;transition:transform .15s,box-shadow .15s}
.f:focus{-webkit-transform:scale(1.08);transform:scale(1.08);z-index:3;box-shadow:0 0 0 .7rem #fff,0 0 0 1.4rem #7B5CFF,0 1.6rem 3rem rgba(38,41,90,.35) !important}

/* ---------- home ---------- */
.title{position:absolute;left:0;top:9rem;width:100rem;text-align:center;font-family:'Lalezar','Baloo Bhaijaan 2',Tahoma,sans-serif;font-weight:400;font-size:9rem;line-height:12rem;color:#fff;text-shadow:0 .7rem 0 #5B3FE0,0 1.4rem 1.6rem rgba(38,41,90,.3)}
.title em{color:#FFD23F}
.tile{position:absolute;width:20rem;height:23rem;border-radius:3rem;top:24.5rem}
.t1{background:#7B5CFF;background:linear-gradient(160deg,#9A80FF,#5B3FE0);box-shadow:0 1rem 0 #3F2AB5}
.t2{background:#F0483A;background:linear-gradient(160deg,#FF9A7A,#F0483A);box-shadow:0 1rem 0 #B82E24}
.t3{background:#1FA866;background:linear-gradient(160deg,#4FE09C,#1FA866);box-shadow:0 1rem 0 #157A4A}
.ti{position:absolute;left:4.5rem;top:2rem;width:11rem;height:11rem;border-radius:50%;background:#fff}
.ti svg{position:absolute;left:1.3rem;top:1.3rem;width:8.4rem;height:8.4rem}
.tl,.ts{position:absolute;left:0;width:20rem;text-align:center;color:#fff}
.tl{top:14.2rem;font-family:'Lalezar','Baloo Bhaijaan 2',Tahoma,sans-serif;font-size:4.2rem;line-height:5rem}
.ts{top:19.4rem;font-size:2.2rem;line-height:3rem;font-weight:700}
.hb{position:absolute;left:8rem;top:33.5rem;white-space:nowrap;background:#fff;border-radius:2.4rem;padding:.8rem 2.2rem;font-size:3rem;line-height:4rem;font-weight:800;box-shadow:0 .5rem 0 #C9D5F5}
.hb:after{content:"";position:absolute;left:1.4rem;bottom:-1.3rem;border-left:1.2rem solid transparent;border-right:1.2rem solid transparent;border-top:1.4rem solid #fff}

/* ---------- fox ---------- */
.zk{position:absolute}
.zk svg{width:100%;height:100%;-webkit-transform-origin:50% 100%;transform-origin:50% 100%}
.zk.idle svg{-webkit-animation:bob 3.2s ease-in-out infinite;animation:bob 3.2s ease-in-out infinite}
.zk.hop svg{-webkit-animation:hop .7s;animation:hop .7s}
@keyframes bob{0%,100%{-webkit-transform:translateY(0);transform:translateY(0)}50%{-webkit-transform:translateY(-.8rem);transform:translateY(-.8rem)}}
@-webkit-keyframes bob{0%,100%{-webkit-transform:translateY(0)}50%{-webkit-transform:translateY(-.8rem)}}
@keyframes hop{0%,100%{-webkit-transform:translateY(0);transform:translateY(0)}30%{-webkit-transform:translateY(-3rem);transform:translateY(-3rem)}60%{-webkit-transform:translateY(0);transform:translateY(0)}}
@-webkit-keyframes hop{0%,100%{-webkit-transform:translateY(0)}30%{-webkit-transform:translateY(-3rem)}60%{-webkit-transform:translateY(0)}}

/* ---------- game shell ---------- */
.bubble{position:absolute;right:14.5rem;top:10.5rem;max-width:70rem;background:#fff;border-radius:3rem;padding:1.2rem 3rem;font-size:4rem;font-weight:800;line-height:5.4rem;box-shadow:0 .6rem 0 #C9D5F5}
.bubble:after{content:"";position:absolute;right:-1.3rem;top:50%;margin-top:-1.1rem;border-top:1.1rem solid transparent;border-bottom:1.1rem solid transparent;border-left:1.5rem solid #fff}

/* memory */
.card{position:absolute;border-radius:2rem}
.front,.back{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:2rem;text-align:center}
.front{background:#5B3FE0;background:linear-gradient(145deg,#9A80FF,#5B3FE0);box-shadow:0 .8rem 0 #3F2AB5;color:#fff;font-family:'Lalezar',Tahoma,sans-serif}
.back{display:none;background:#fff;box-shadow:0 .8rem 0 #C9D5F5}
.back svg{position:absolute;left:16%;top:16%;width:68%;height:68%}
.card.open .front,.card.done .front{display:none}
.card.open .back,.card.done .back{display:block;-webkit-animation:flipin .4s;animation:flipin .4s}
.card.done .back{background:#EAFFF1;box-shadow:0 .8rem 0 #9DE3B8}
@keyframes flipin{from{-webkit-transform:scaleX(.1);transform:scaleX(.1)}to{-webkit-transform:scaleX(1);transform:scaleX(1)}}
@-webkit-keyframes flipin{from{-webkit-transform:scaleX(.1)}to{-webkit-transform:scaleX(1)}}

/* shapes */
.opt{position:absolute;top:28rem;width:19rem;height:19rem;border-radius:3rem;background:#fff;box-shadow:0 1rem 0 #C9D5F5}
.opt svg{position:absolute;left:2.2rem;top:2.2rem;width:14.6rem;height:14.6rem}

/* counting */
.apanel{position:absolute;left:19rem;top:21rem;width:62rem;height:19rem;border-radius:3rem;background:#fff;background:rgba(255,255,255,.9);box-shadow:0 .8rem 0 #C9D5F5}
.ap{position:absolute;width:8rem;height:8rem}
.ap svg{width:100%;height:100%}
.ap.pop{-webkit-animation:pop .5s;animation:pop .5s}
.lbl{position:absolute;left:0;top:0;width:8rem;text-align:center;line-height:8rem;font-family:'Lalezar',Tahoma,sans-serif;font-size:3.8rem;color:#fff;text-shadow:0 .25rem 0 rgba(120,20,20,.5);opacity:0}
.pop .lbl{opacity:1}
.num{position:absolute;top:43rem;width:12rem;height:12rem;border-radius:3rem;color:#fff;text-align:center;font-family:'Lalezar',Tahoma,sans-serif;font-size:8rem;line-height:12rem}
.n0{background:#F0483A;background:linear-gradient(160deg,#FF9A7A,#F0483A);box-shadow:0 1rem 0 #B82E24}
.n1{background:#5B3FE0;background:linear-gradient(160deg,#9A80FF,#5B3FE0);box-shadow:0 1rem 0 #3F2AB5}
.n2{background:#2A8FD6;background:linear-gradient(160deg,#49BDF5,#2A8FD6);box-shadow:0 1rem 0 #1B66A3}
.n3{background:#F2A100;background:linear-gradient(160deg,#FFC93C,#F2A100);box-shadow:0 1rem 0 #B87800}

.opt.good{background:#EAFFF1;box-shadow:0 1rem 0 #7ED9A3,0 0 0 1rem #2FC878 !important;-webkit-animation:pop .6s;animation:pop .6s}
.num.good{background:#2FC878;box-shadow:0 1rem 0 #157A4A,0 0 0 1rem #fff !important;-webkit-animation:pop .6s;animation:pop .6s}
.no{-webkit-animation:shake .5s;animation:shake .5s}
@keyframes pop{0%,100%{-webkit-transform:scale(1);transform:scale(1)}40%{-webkit-transform:scale(1.18);transform:scale(1.18)}70%{-webkit-transform:scale(.95);transform:scale(.95)}}
@-webkit-keyframes pop{0%,100%{-webkit-transform:scale(1)}40%{-webkit-transform:scale(1.18)}70%{-webkit-transform:scale(.95)}}
@keyframes shake{0%,100%{-webkit-transform:translateX(0);transform:translateX(0)}20%{-webkit-transform:translateX(-1rem);transform:translateX(-1rem)}40%{-webkit-transform:translateX(1rem);transform:translateX(1rem)}60%{-webkit-transform:translateX(-.6rem);transform:translateX(-.6rem)}80%{-webkit-transform:translateX(.6rem);transform:translateX(.6rem)}}
@-webkit-keyframes shake{0%,100%{-webkit-transform:translateX(0)}20%{-webkit-transform:translateX(-1rem)}40%{-webkit-transform:translateX(1rem)}60%{-webkit-transform:translateX(-.6rem)}80%{-webkit-transform:translateX(.6rem)}}

/* overlay + rest */
.overlay{display:none;background:rgba(38,41,90,.6);overflow:hidden;z-index:50}
.overlay.on{display:block}
.panel{position:absolute;left:20rem;top:6rem;width:60rem;height:44rem;background:#fff;border-radius:5rem;box-shadow:0 1.4rem 0 #C9D5F5;text-align:center}
.panel h2{position:absolute;left:0;top:16rem;width:60rem;font-family:'Lalezar',Tahoma,sans-serif;font-weight:400;font-size:7rem;line-height:8rem;color:#7B5CFF}
.sub{position:absolute;left:0;top:25.5rem;width:60rem;font-size:3.6rem;line-height:5rem;font-weight:800}
.sub svg{display:inline-block;vertical-align:middle;width:4rem;height:4rem}
.btn{position:absolute;width:24rem;height:7.5rem;border-radius:3rem;font-size:3.6rem;line-height:7.5rem;font-weight:800;color:#fff;text-align:center}
.btn.g{background:#1FA866;background:linear-gradient(160deg,#4FE09C,#1FA866);box-shadow:0 .8rem 0 #157A4A}
.btn.v{background:#5B3FE0;background:linear-gradient(160deg,#9A80FF,#5B3FE0);box-shadow:0 .8rem 0 #3F2AB5}
.cf{position:absolute;top:-4rem;width:2.4rem;height:2.4rem;border-radius:35%;-webkit-animation:fall linear forwards;animation:fall linear forwards}
@keyframes fall{from{top:-4rem;-webkit-transform:rotate(0deg);transform:rotate(0deg)}to{top:60rem;-webkit-transform:rotate(540deg);transform:rotate(540deg)}}
@-webkit-keyframes fall{from{top:-4rem;-webkit-transform:rotate(0deg)}to{top:60rem;-webkit-transform:rotate(540deg)}}
#rest h2{position:absolute;left:0;top:31.5rem;width:100rem;text-align:center;font-family:'Lalezar',Tahoma,sans-serif;font-weight:400;font-size:8rem;line-height:9rem;color:#fff;text-shadow:0 .7rem 0 #5B3FE0}
#rest p{position:absolute;left:0;top:41rem;width:100rem;text-align:center;font-size:3.6rem;line-height:5rem;font-weight:800}
#rest p span{background:#fff;border-radius:3rem;padding:.8rem 3rem}
.zzz{position:absolute;left:0;top:3rem;width:100rem;text-align:center;font-family:'Lalezar',Tahoma,sans-serif;font-size:6rem;line-height:7rem;color:#fff;text-shadow:0 .4rem 0 #5B3FE0}
.snd .slash{display:none}
.snd.off .slash{display:inline}
body.legacy,body.legacy *{font-family:Tahoma,Arial,'DejaVu Sans','Liberation Sans',sans-serif !important}
#err{position:fixed;left:0;bottom:0;z-index:999;display:none;background:#b00;color:#fff;font:14px monospace;padding:4px 8px;direction:ltr;max-width:100%}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="s-apple" viewBox="0 0 100 100"><circle cx="38" cy="58" r="28" fill="#FF4D4D"/><circle cx="62" cy="58" r="28" fill="#FF4D4D"/><rect x="47.5" y="20" width="5" height="18" rx="2.5" fill="#6B3E1E"/><path d="M52 28C60 12 78 12 82 22C74 34 58 34 52 28Z" fill="#2FC878"/><ellipse cx="30" cy="52" rx="5.5" ry="9" fill="#fff" opacity=".45" transform="rotate(20 30 52)"/></symbol>
<symbol id="s-fish" viewBox="0 0 100 100"><path d="M70 50L96 28V72Z" fill="#FF9F1C"/><ellipse cx="44" cy="50" rx="34" ry="24" fill="#FFB703"/><path d="M34 28Q44 14 56 28Z" fill="#FF9F1C"/><circle cx="28" cy="44" r="7" fill="#fff"/><circle cx="26" cy="44" r="3.5" fill="#26295A"/><path d="M52 34Q60 50 52 66" stroke="#FF9F1C" stroke-width="4" fill="none" stroke-linecap="round"/></symbol>
<symbol id="s-star" viewBox="0 0 100 100"><polygon points="50,7 61.5,37 94,38 68,58 77,90 50,71 23,90 32,58 6,38 38.5,37" fill="#FFD23F" stroke="#F2A900" stroke-width="5" stroke-linejoin="round"/></symbol>
<symbol id="s-heart" viewBox="0 0 100 100"><path d="M50 88C10 58 6 30 28 22C40 18 48 26 50 32C52 26 60 18 72 22C94 30 90 58 50 88Z" fill="#FF5C8A"/><ellipse cx="30" cy="36" rx="6" ry="9" fill="#fff" opacity=".4" transform="rotate(30 30 36)"/></symbol>
<symbol id="s-flower" viewBox="0 0 100 100"><rect x="47" y="56" width="6" height="40" rx="3" fill="#2FC878"/><g fill="#FF8FD0"><circle cx="50" cy="24" r="17"/><circle cx="76" cy="43" r="17"/><circle cx="66" cy="72" r="17"/><circle cx="34" cy="72" r="17"/><circle cx="24" cy="43" r="17"/></g><circle cx="50" cy="52" r="14" fill="#FFD23F"/></symbol>
<symbol id="s-sun" viewBox="0 0 100 100"><g stroke="#FFB703" stroke-width="7" stroke-linecap="round"><path d="M50 8V20M50 80V92M8 50H20M80 50H92M20 20L28 28M80 20L72 28M20 80L28 72M80 80L72 72"/></g><circle cx="50" cy="50" r="24" fill="#FFC21A"/><circle cx="42" cy="44" r="6" fill="#FFE27A" opacity=".8"/></symbol>
</defs></svg>

<div class="world"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="hill h1"></div><div class="hill h2"></div><div class="grass"></div></div>

<div id="stage" lang="ar">

<div class="screen on" id="home">
  <button class="f round snd" data-act="sound" style="right:3rem;top:2rem" aria-label="الصوت"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="slash" d="M3 3L21 21" stroke="#FF4B4B" stroke-width="3" stroke-linecap="round"/></svg></button>
  <div class="starcount"><svg viewBox="0 0 100 100"><use xlink:href="#s-star" href="#s-star"/></svg><b class="starnum">٠</b></div>
  <h1 class="title">مغامرات <em>مراد</em></h1>
  <button class="f tile t1" data-go="memory" style="left:63rem"><span class="ti"><svg viewBox="0 0 100 100"><rect x="8" y="22" width="40" height="56" rx="8" fill="#7B5CFF"/><text x="28" y="64" text-anchor="middle" font-size="40" fill="#fff" font-family="Lalezar,sans-serif">؟</text><rect x="52" y="22" width="40" height="56" rx="8" fill="#fff" stroke="#7B5CFF" stroke-width="4"/><use xlink:href="#s-apple" href="#s-apple" x="57" y="37" width="30" height="30"/></svg></span><span class="tl">لعبة الذاكرة</span><span class="ts">لاقي الصورتين</span></button>
  <button class="f tile t2" data-go="shapes" style="left:40rem"><span class="ti"><svg viewBox="0 0 100 100"><circle cx="28" cy="32" r="20" fill="#FF4B4B"/><rect x="52" y="12" width="36" height="36" rx="6" fill="#3D8BFF"/><polygon points="50,56 78,92 22,92" fill="#2FB86B" stroke="#2FB86B" stroke-width="5" stroke-linejoin="round"/></svg></span><span class="tl">ألوان وأشكال</span><span class="ts">فين الشكل ده؟</span></button>
  <button class="f tile t3" data-go="count" style="left:17rem"><span class="ti"><svg viewBox="0 0 100 100"><use xlink:href="#s-apple" href="#s-apple" x="26" y="6" width="48" height="48"/><use xlink:href="#s-apple" href="#s-apple" x="4" y="46" width="48" height="48"/><use xlink:href="#s-apple" href="#s-apple" x="48" y="46" width="48" height="48"/></svg></span><span class="tl">نعدّ سوا</span><span class="ts">كام تفاحة؟</span></button>
  <div class="zk idle" style="left:1.5rem;top:38rem;width:15rem;height:15.6rem"></div>
  <div class="hb">يلا نلعب يا مراد!</div>
</div>

<div class="screen" id="memory"></div>
<div class="screen" id="shapes"></div>
<div class="screen" id="count"></div>

<div class="screen" id="rest">
  <div class="zzz">Zzz</div>
  <div class="zk" data-sleepy="1" style="left:40.5rem;top:10rem;width:19rem;height:19.7rem"></div>
  <h2>خلصنا النهارده!</h2>
  <p><span>الثعلب تعب ورايح ينام. نشوفك بكرة يا مراد</span></p>
  <button class="f btn g" data-act="reset" style="left:38rem;top:49.5rem;height:6rem;line-height:6rem">ابدأ من جديد</button>
</div>

<div class="overlay" id="ov">
  <div class="panel">
    <div class="zk idle" style="left:24rem;top:2.5rem;width:12rem;height:12.5rem"></div>
    <h2>برافو يا مراد!</h2>
    <div class="sub"><span>كسبت</span> <b class="gain">٣</b> <svg viewBox="0 0 100 100"><use xlink:href="#s-star" href="#s-star"/></svg></div>
    <button class="f btn g" data-act="again" style="left:31.5rem;top:34rem">نلعب تاني</button>
    <button class="f btn v" data-act="home" style="left:4.5rem;top:34rem">الرئيسية</button>
  </div>
</div>
</div>
<div id="err"></div>

<script>
(function(){
'use strict';
var AR=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩','١٠'];
var W=['صفر','واحد','اتنين','تلاتة','أربعة','خمسة','ستة','سبعة','تمانية','تسعة','عشرة'];
var PRAISE=['برافو!','ممتاز!','شاطر أوي!','جميل جدًا!','أحسنت!','يا سلام عليك!'];
var OOPS=['جرّب تاني','قرّب! جرّب تاني','معلش، حاول تاني'];
var REST_MS=15*60*1000;

window.onerror=function(m,u,l){var e=document.getElementById('err');if(e){e.style.display='block';e.textContent='Error: '+m+' (line '+l+')'}};

function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){var l=(r||document).querySelectorAll(s),a=[],i;for(i=0;i<l.length;i++)a.push(l[i]);return a}
function has(el,c){return typeof el.className==='string'&&(' '+el.className+' ').indexOf(' '+c+' ')>-1}
function addC(el,c){if(!has(el,c))el.className=el.className?el.className+' '+c:c}
function remC(el,c){el.className=(' '+el.className+' ').split(' '+c+' ').join(' ').replace(/^\s+|\s+$/g,'')}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- Arabic shaping for engines that cannot join letters ---------- */
var SHAPE=false;
var SH={'ء':[0xFE80],'آ':[0xFE81,0xFE82],'أ':[0xFE83,0xFE84],'ؤ':[0xFE85,0xFE86],'إ':[0xFE87,0xFE88],'ئ':[0xFE89,0xFE8A,0xFE8B,0xFE8C],'ا':[0xFE8D,0xFE8E],'ب':[0xFE8F,0xFE90,0xFE91,0xFE92],'ة':[0xFE93,0xFE94],'ت':[0xFE95,0xFE96,0xFE97,0xFE98],'ث':[0xFE99,0xFE9A,0xFE9B,0xFE9C],'ج':[0xFE9D,0xFE9E,0xFE9F,0xFEA0],'ح':[0xFEA1,0xFEA2,0xFEA3,0xFEA4],'خ':[0xFEA5,0xFEA6,0xFEA7,0xFEA8],'د':[0xFEA9,0xFEAA],'ذ':[0xFEAB,0xFEAC],'ر':[0xFEAD,0xFEAE],'ز':[0xFEAF,0xFEB0],'س':[0xFEB1,0xFEB2,0xFEB3,0xFEB4],'ش':[0xFEB5,0xFEB6,0xFEB7,0xFEB8],'ص':[0xFEB9,0xFEBA,0xFEBB,0xFEBC],'ض':[0xFEBD,0xFEBE,0xFEBF,0xFEC0],'ط':[0xFEC1,0xFEC2,0xFEC3,0xFEC4],'ظ':[0xFEC5,0xFEC6,0xFEC7,0xFEC8],'ع':[0xFEC9,0xFECA,0xFECB,0xFECC],'غ':[0xFECD,0xFECE,0xFECF,0xFED0],'ف':[0xFED1,0xFED2,0xFED3,0xFED4],'ق':[0xFED5,0xFED6,0xFED7,0xFED8],'ك':[0xFED9,0xFEDA,0xFEDB,0xFEDC],'ل':[0xFEDD,0xFEDE,0xFEDF,0xFEE0],'م':[0xFEE1,0xFEE2,0xFEE3,0xFEE4],'ن':[0xFEE5,0xFEE6,0xFEE7,0xFEE8],'ه':[0xFEE9,0xFEEA,0xFEEB,0xFEEC],'و':[0xFEED,0xFEEE],'ى':[0xFEEF,0xFEF0],'ي':[0xFEF1,0xFEF2,0xFEF3,0xFEF4]};
var LAM={'ا':[0xFEFB,0xFEFC],'أ':[0xFEF7,0xFEF8],'إ':[0xFEF9,0xFEFA],'آ':[0xFEF5,0xFEF6]};
function ar(s){
  if(!SHAPE)return s;
  var L=String(s).replace(/[ً-ْ]/g,''),n=L.length,out='',i,ch,e,p,pj,nx,nj,f;
  for(i=0;i<n;i++){
    ch=L.charAt(i);e=SH[ch];
    if(!e){out+=ch;continue}
    p=i>0?SH[L.charAt(i-1)]:null;pj=!!(p&&p.length===4);
    if(ch==='ل'&&LAM[L.charAt(i+1)]){out+=String.fromCharCode(pj?LAM[L.charAt(i+1)][1]:LAM[L.charAt(i+1)][0]);i++;continue}
    nx=SH[L.charAt(i+1)];nj=!!(e.length===4&&nx&&nx.length>=2);
    if(e.length===1)f=e[0];
    else if(e.length===2)f=pj?e[1]:e[0];
    else f=(pj&&nj)?e[3]:pj?e[1]:nj?e[2]:e[0];
    out+=String.fromCharCode(f);
  }
  return out;
}
function shapeTree(root){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false),n,list=[],i;
  while((n=w.nextNode()))list.push(n);
  for(i=0;i<list.length;i++){if(/[؀-ۿ]/.test(list[i].nodeValue))list[i].nodeValue=ar(list[i].nodeValue)}
}
function detectShape(){
  try{
    var st=$('#stage'),a=document.createElement('span'),b=document.createElement('span');
    var css='position:absolute;left:0;top:0;visibility:hidden;white-space:nowrap;font-size:40px;font-family:Tahoma,Arial,"DejaVu Sans",sans-serif';
    a.style.cssText=css;b.style.cssText=css;a.textContent='ب';b.textContent='ببب';
    st.appendChild(a);st.appendChild(b);
    var w1=a.offsetWidth,w3=b.offsetWidth;
    st.removeChild(a);st.removeChild(b);
    return w1>0&&Math.abs(w3-3*w1)<1.5;
  }catch(e){return false}
}

/* ---------- sound ---------- */
var ac=null;
function ctx(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==='suspended'){try{ac.resume()}catch(e){}}
  return ac;
}
function tone(f,t,d,type,vol){
  if(!soundOn)return;
  try{
    var c=ctx();if(!c)return;
    var o=c.createOscillator(),g=(c.createGain||c.createGainNode).call(c),s=c.currentTime+t;
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol||.2,s+.02);g.gain.exponentialRampToValueAtTime(0.0001,s+d);
    o.connect(g);g.connect(c.destination);
    (o.start||o.noteOn).call(o,s);(o.stop||o.noteOff).call(o,s+d+.05);
  }catch(e){}
}
var sfx={
  flip:function(){tone(520,0,.08,'triangle',.15)},
  tick:function(i){tone(440+i*55,0,.14,'triangle',.18)},
  good:function(){[523,659,784,1047].forEach(function(f,i){tone(f,i*.09,.25,'sine',.22)})},
  bad:function(){tone(300,0,.18,'sine',.14);tone(240,.14,.25,'sine',.14)},
  win:function(){[523,659,784,659,784,1047,1319].forEach(function(f,i){tone(f,i*.12,.3,'triangle',.22)})}
};
var voice=null;
function pickVoice(){try{var v=speechSynthesis.getVoices(),i;for(i=0;i<v.length;i++){if(/^ar/i.test(v[i].lang)){voice=v[i];return}}}catch(e){}}

}

/* ---------- memory game ---------- */
var SYMS=['apple','fish','star','heart','flower','sun'];
var MEM=[{p:3,cols:3,cw:14},{p:4,cols:4,cw:13},{p:6,cols:4,cw:10}];
var memL=0,opened=[],lock=false,matched=0,memTotal=0;
function startMemory(l){
  memL=l;var c=MEM[l];opened=[];lock=false;matched=0;memTotal=c.p;
  pips(3,l);setQ('لاقي الصورتين المتشابهتين');say('لاقي الصورتين المتشابهتين');
  var pick=shuffle(SYMS).slice(0,c.p),deck=shuffle(pick.concat(pick)),gap=1.8;
  var rows=Math.ceil(deck.length/c.cols),gw=c.cols*c.cw+(c.cols-1)*gap,gh=rows*c.cw+(rows-1)*gap,x0=(100-gw)/2,y0=19.5+(35.5-gh)/2,h='';
  deck.forEach(function(s,i){
    var r=Math.floor(i/c.cols),k=i%c.cols;
    h+='<button class="f card" data-sym="'+s+'" aria-label="كارت" style="left:'+(x0+k*(c.cw+gap))+'rem;top:'+(y0+r*(c.cw+gap))+'rem;width:'+c.cw+'rem;height:'+c.cw+'rem"><span class="front" style="font-size:'+(c.cw*.55)+'rem;line-height:'+c.cw+'rem">؟</span><span class="back">'+ic('s-'+s)+'</span></button>';
  });
  $('#memory .play').innerHTML=h;
  focusEl($('#memory .card'));
}
function flip(card){
  if(lock||has(card,'open')||has(card,'done'))return;
  addC(card,'open');sfx.flip();opened.push(card);
  if(opened.length<2)return;
  lock=true;var a=opened[0],b=opened[1],l=memL;opened=[];
  if(a.getAttribute('data-sym')===b.getAttribute('data-sym')){
    later(function(){
      addC(a,'done');addC(b,'done');sfx.good();praise();hop();matched++;lock=false;
      if(matched===memTotal){
        award();pips(3,l+1);
        if(l<2)later(function(){startMemory(l+1)},1500);else later(function(){finish('memory',3)},1000);
      }
    },550);
  }else{
    later(function(){remC(a,'open');remC(b,'open');lock=false},1000);
  }
}

/* ---------- colors & shapes ---------- */
var COL=[{id:'red',c:'#FF4B4B',m:'الأحمر',f:'الحمرا'},{id:'blue',c:'#3D8BFF',m:'الأزرق',f:'الزرقا'},{id:'yellow',c:'#FFC400',m:'الأصفر',f:'الصفرا'},{id:'green',c:'#2FB86B',m:'الأخضر',f:'الخضرا'}];

function startShapes(){sRound=0;sNext()}

  if(sRound>=5){finish('shapes',5);return}

  sKey=tS.id+'-'+tC.id;

    for(j=0;j<opts.length;j++){if(opts[j].s.id+'-'+opts[j].c.id===k)dup=true}

/* ---------- counting ---------- */

  cAns=n;

  for(i=0;i<n;i++){

/* ---------- input ---------- */
function setSound(on){
  soundOn=on;
  $$('.snd').forEach(function(b){if(on)remC(b,'off');else addC(b,'off')});
  if(!on&&window.speechSynthesis){try{speechSynthesis.cancel()}catch(e){}}
}
function greet(){if(greeted)return;greeted=true;ctx();say('أهلاً يا مراد! يلا نلعب')}
function target(el){
  while(el&&el.nodeType===1){
    if(el.getAttribute&&(el.getAttribute('data-go')||el.getAttribute('data-act')))return el;
    if(has(el,'card')||has(el,'opt')||has(el,'num'))return el;
    el=el.parentNode;
  }
  return null;
}
document.addEventListener('click',function(e){
  greet();
  var t=target(e.target||e.srcElement);
  if(!t)return;
  if(t.getAttribute('data-go'))return go(t.getAttribute('data-go'));
  var a=t.getAttribute('data-act');
  if(a==='home')return go('home');
  if(a==='again')return go(ovGame);
  if(a==='sound')return setSound(!soundOn);
  if(a==='reset'){startedAt=new Date().getTime();return go('home')}
  if(has(t,'card'))return flip(t);
  if(has(t,'opt'))return pickShape(t);
  if(has(t,'num'))return pickNum(t);
},false);
function focusables(){
  var scope=has($('#ov'),'on')?$('#ov'):$('.screen.on');
  return $$('.f',scope).filter(function(el){return !el.disabled&&el.offsetWidth>0});
}
function move(dx,dy){
  var list=focusables(),c=document.activeElement;
  if(!c||list.indexOf(c)<0){focusEl(list[0]);return}
  var r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,bs=1e9;
  list.forEach(function(el){
    if(el===c)return;
    var b=el.getBoundingClientRect(),ex=b.left+b.width/2-cx,ey=b.top+b.height/2-cy,along=ex*dx+ey*dy;
    if(along<=2)return;
    var across=dx?Math.abs(ey):Math.abs(ex),s=along+across*2;
    if(s<bs){bs=s;best=el}
  });
  focusEl(best);
}
document.addEventListener('keydown',function(e){
  var k=e.keyCode||e.which;greet();ctx();
  if(k===37){e.preventDefault();move(-1,0)}
  else if(k===39){e.preventDefault();move(1,0)}
  else if(k===38){e.preventDefault();move(0,-1)}
  else if(k===40){e.preventDefault();move(0,1)}
