/* Legacy-safe build for 2015-era TV browsers: no CSS variables, no flex/grid/gap, no JS beyond ES5.
   Everything lives on one fixed 16:9 stage (100rem x 56.25rem) whose rem is set from the window size. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
html{font-size:9px}
body{background:#DDF7FF;color:#26295A;font-family:'ZK',Tahoma,Arial,sans-serif;font-size:3rem}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;outline:none}
svg{display:block}
em{font-style:normal}

/* ---------- backdrop ---------- */
.world{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;background:#BDEBFF;background:linear-gradient(#49BDF5,#DDF7FF 72%)}
.sun{position:absolute;top:5rem;right:9rem;width:11rem;height:11rem;border-radius:50%;background:#FFD23F;box-shadow:0 0 0 2rem rgba(255,230,120,.35),0 0 0 4.5rem rgba(255,230,120,.2)}
.cloud{position:absolute;left:0;height:4rem;width:12rem;background:#fff;border-radius:4rem;-webkit-animation:drift linear infinite;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:6rem;height:6rem;left:1.5rem;top:-3rem}
.cloud:after{width:4.6rem;height:4.6rem;right:2rem;top:-2rem}
.c1{top:10rem;-webkit-animation-duration:80s;animation-duration:80s;-webkit-animation-delay:-30s;animation-delay:-30s}
.c2{top:22rem;-webkit-animation-name:driftb;animation-name:driftb;-webkit-animation-duration:110s;animation-duration:110s;-webkit-animation-delay:-70s;animation-delay:-70s}
.c3{top:5rem;-webkit-animation-name:driftc;animation-name:driftc;-webkit-animation-duration:95s;animation-duration:95s;-webkit-animation-delay:-10s;animation-delay:-10s}
.hill{position:absolute;border-radius:50%}
.h1{left:-12%;bottom:-27%;width:75%;height:55%;background:#86E08F}
.h2{right:-18%;bottom:-30%;width:90%;height:50%;background:#4CC873}
.grass{position:absolute;left:0;bottom:0;width:100%;height:6%;background:#4CC873}
@keyframes drift{from{-webkit-transform:translateX(-25rem);transform:translateX(-25rem)}to{-webkit-transform:translateX(150vw);transform:translateX(150vw)}}
@-webkit-keyframes drift{from{-webkit-transform:translateX(-25rem)}to{-webkit-transform:translateX(150vw)}}
@keyframes driftb{from{-webkit-transform:translateX(-25rem) scale(.7);transform:translateX(-25rem) scale(.7)}to{-webkit-transform:translateX(150vw) scale(.7);transform:translateX(150vw) scale(.7)}}
@-webkit-keyframes driftb{from{-webkit-transform:translateX(-25rem) scale(.7)}to{-webkit-transform:translateX(150vw) scale(.7)}}
@keyframes driftc{from{-webkit-transform:translateX(-25rem) scale(.55);transform:translateX(-25rem) scale(.55)}to{-webkit-transform:translateX(150vw) scale(.55);transform:translateX(150vw) scale(.55)}}
@-webkit-keyframes driftc{from{-webkit-transform:translateX(-25rem) scale(.55)}to{-webkit-transform:translateX(150vw) scale(.55)}}

/* ---------- stage ---------- */
#stage{position:fixed;left:0;top:0;width:100rem;height:56.25rem;direction:rtl;overflow:hidden}
.screen,.play,.overlay{position:absolute;left:0;top:0;width:100rem;height:56.25rem}
.screen{display:none}
.screen.on{display:block;-webkit-animation:fadein .35s;animation:fadein .35s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@-webkit-keyframes fadein{from{opacity:0}to{opacity:1}}

.round{z-index:6;position:absolute;width:6rem;height:6rem;border-radius:50%;background:#fff;color:#7B5CFF;box-shadow:0 .5rem 0 #C9D5F5}
.round svg{position:absolute;left:1.3rem;top:1.3rem;width:3.4rem;height:3.4rem}
.starcount{position:absolute;left:3rem;top:2rem;height:6rem;padding:0 2.2rem 0 5.8rem;background:#fff;border-radius:3rem;box-shadow:0 .5rem 0 #C9D5F5;font-size:3.2rem;font-weight:800;line-height:6rem;direction:rtl}
.starcount svg{position:absolute;left:1.4rem;top:1.2rem;width:3.6rem;height:3.6rem}
.pips{position:absolute;left:0;top:3.9rem;width:100rem;text-align:center;font-size:0;line-height:0}
.pip{display:inline-block;width:2.2rem;height:2.2rem;border-radius:50%;margin:0 .55rem;background:rgba(255,255,255,.7);border:.3rem solid #fff}
.pip.on{background:#FFD23F;box-shadow:0 0 1.4rem 0 #FFD23F}

.f{-webkit-transition:-webkit-transform .15s,box-shadow .15s;transition:transform .15s,box-shadow .15s}
.f:focus{-webkit-transform:scale(1.08);transform:scale(1.08);z-index:3;box-shadow:0 0 0 .7rem #fff,0 0 0 1.4rem #7B5CFF,0 1.6rem 3rem rgba(38,41,90,.35) !important}

/* ---------- home ---------- */
.title{position:absolute;left:0;top:5.5rem;width:100rem;text-align:center;font-family:'ZK',Tahoma,Arial,sans-serif;font-weight:400;font-size:8rem;line-height:11rem;color:#fff;text-shadow:0 .7rem 0 #5B3FE0,0 1.4rem 1.6rem rgba(38,41,90,.3)}
.title em{color:#FFD23F}
.tile{position:absolute;width:20.5rem;height:23rem;border-radius:3rem;top:19.5rem}
.t1{background:#7B5CFF;background:linear-gradient(160deg,#9A80FF,#5B3FE0);box-shadow:0 1rem 0 #3F2AB5}
.t2{background:#F0483A;background:linear-gradient(160deg,#FF9A7A,#F0483A);box-shadow:0 1rem 0 #B82E24}
.t4{background:#F2A100;background:linear-gradient(160deg,#FFC93C,#F2A100);box-shadow:0 1rem 0 #B87800}
.t3{background:#1FA866;background:linear-gradient(160deg,#4FE09C,#1FA866);box-shadow:0 1rem 0 #157A4A}
.ti{position:absolute;left:4.75rem;top:2rem;width:11rem;height:11rem;border-radius:50%;background:#fff}
.ti svg{position:absolute;left:1.3rem;top:1.3rem;width:8.4rem;height:8.4rem}
.tl,.ts{position:absolute;left:0;width:20.5rem;text-align:center;color:#fff}
.tl{top:14.2rem;font-family:'ZK',Tahoma,Arial,sans-serif;font-size:3.1rem;line-height:5rem;white-space:nowrap}
.ts{top:19.4rem;white-space:nowrap;font-size:2rem;line-height:3rem;font-weight:700}
.hb{position:absolute;left:17rem;top:46.5rem;white-space:nowrap;background:#fff;border-radius:2.4rem;padding:.8rem 2.2rem;font-size:3rem;line-height:4rem;font-weight:800;box-shadow:0 .5rem 0 #C9D5F5}
.hb:after{content:"";position:absolute;left:-1.3rem;top:50%;margin-top:-1.2rem;border-top:1.2rem solid transparent;border-bottom:1.2rem solid transparent;border-right:1.4rem solid #fff}

/* ---------- fox ---------- */
.zk{position:absolute}
.zk svg{width:100%;height:100%;-webkit-transform-origin:50% 100%;transform-origin:50% 100%}
.zk.idle svg{-webkit-animation:bob 3.2s ease-in-out infinite;animation:bob 3.2s ease-in-out infinite}
.zk.hop svg{-webkit-animation:hop .7s;animation:hop .7s}
@keyframes bob{0%,100%{-webkit-transform:translateY(0);transform:translateY(0)}50%{-webkit-transform:translateY(-.8rem);transform:translateY(-.8rem)}}
@-webkit-keyframes bob{0%,100%{-webkit-transform:translateY(0)}50%{-webkit-transform:translateY(-.8rem)}}
@keyframes hop{0%,100%{-webkit-transform:translateY(0);transform:translateY(0)}30%{-webkit-transform:translateY(-3rem);transform:translateY(-3rem)}60%{-webkit-transform:translateY(0);transform:translateY(0)}}
@-webkit-keyframes hop{0%,100%{-webkit-transform:translateY(0)}30%{-webkit-transform:translateY(-3rem)}60%{-webkit-transform:translateY(0)}}

/* ---------- game shell ---------- */
.bubble{position:absolute;right:14.5rem;top:10.5rem;max-width:70rem;background:#fff;border-radius:3rem;padding:1.2rem 3rem;font-size:4rem;font-weight:800;line-height:5.4rem;box-shadow:0 .6rem 0 #C9D5F5}
.bubble:after{content:"";position:absolute;right:-1.3rem;top:50%;margin-top:-1.1rem;border-top:1.1rem solid transparent;border-bottom:1.1rem solid transparent;border-left:1.5rem solid #fff}

/* memory */
.card{position:absolute;border-radius:2rem}
.front,.back{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:2rem;text-align:center}
.front{background:#5B3FE0;background:linear-gradient(145deg,#9A80FF,#5B3FE0);box-shadow:0 .8rem 0 #3F2AB5;color:#fff;font-family:'ZK',Tahoma,Arial,sans-serif}
.back{display:none;background:#fff;box-shadow:0 .8rem 0 #C9D5F5}
.back svg{position:absolute;left:16%;top:16%;width:68%;height:68%}
.card.open .front,.card.done .front{display:none}
.card.open .back,.card.done .back{display:block;-webkit-animation:flipin .4s;animation:flipin .4s}
.card.done .back{background:#EAFFF1;box-shadow:0 .8rem 0 #9DE3B8}
@keyframes flipin{from{-webkit-transform:scaleX(.1);transform:scaleX(.1)}to{-webkit-transform:scaleX(1);transform:scaleX(1)}}

function hop(){$$('.screen.on .zk').forEach(function(el){remC(el,'hop');void el.offsetWidth;addC(el,'hop')})}

/* ---------- sound ---------- */
var ac=null;
function ctx(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==='suspended'){try{ac.resume()}catch(e){}}
  return ac;
}
function tone(f,t,d,type,vol){
  if(!soundOn)return;
  try{
    var c=ctx();if(!c)return;
    var o=c.createOscillator(),g=(c.createGain||c.createGainNode).call(c),s=c.currentTime+t;
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol||.2,s+.02);g.gain.exponentialRampToValueAtTime(0.0001,s+d);
    o.connect(g);g.connect(c.destination);
    (o.start||o.noteOn).call(o,s);(o.stop||o.noteOff).call(o,s+d+.05);
  }catch(e){}
}
var sfx={
  flip:function(){tone(520,0,.08,'triangle',.15)},
  tick:function(i){tone(440+i*55,0,.14,'triangle',.18)},
  good:function(){[523,659,784,1047].forEach(function(f,i){tone(f,i*.09,.25,'sine',.22)})},
  bad:function(){tone(300,0,.18,'sine',.14);tone(240,.14,.25,'sine',.14)},
  win:function(){[523,659,784,659,784,1047,1319].forEach(function(f,i){tone(f,i*.12,.3,'triangle',.22)})}
};
var voice=null,voiceEn=null;
function pickVoice(){try{var v=speechSynthesis.getVoices(),i;for(i=0;i<v.length;i++){if(!voice&&/^ar/i.test(v[i].lang))voice=v[i];if(!voiceEn&&/^en/i.test(v[i].lang))voiceEn=v[i]}}catch(e){}}
if(window.speechSynthesis){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function say(t,lang,times){
  if(!soundOn||!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;
  try{
    speechSynthesis.cancel();
    var en=lang==='en',vo=en?voiceEn:voice,n=times||1,k,u;
    for(k=0;k<n;k++){
      u=new SpeechSynthesisUtterance(t);u.lang=vo?vo.lang:(en?'en-US':'ar-EG');if(vo)u.voice=vo;u.rate=.8;u.pitch=1.2;
      speechSynthesis.speak(u);
    }
  }catch(e){}
}
function praise(){say(PRAISE[rnd(PRAISE.length)])}
function oops(){return OOPS[rnd(OOPS.length)]}

/* ---------- screens ---------- */
var HOME='<svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg>';
['memory','shapes','count','letters'].forEach(function(id){
  $('#'+id).innerHTML='<button class="f round" data-act="home" style="right:3rem;top:2rem" aria-label="الرئيسية">'+HOME+'</button><div class="pips"></div><div class="starcount"><svg viewBox="0 0 100 100"><use xlink:href="#s-star" href="#s-star"/></svg><b class="starnum">0</b></div><div class="zk idle" style="right:3rem;top:9rem;width:9rem;height:9.4rem">'+zaki(false)+'</div><div class="bubble"><span class="q"></span></div><div class="play"></div>';
});
$$('.zk').forEach(function(z){if(!z.firstChild)z.innerHTML=zaki(z.getAttribute('data-sleepy')==='1')});

function setQ(t){var q=$('.screen.on .q');if(q)q.textContent=ar(t)}
function setQH(h){var q=$('.screen.on .q');if(q)q.innerHTML=h}
function pips(n,d){var h='',i;for(i=0;i<n;i++)h+='<i class="pip'+(i<d?' on':'')+'"></i>';var p=$('.screen.on .pips');if(p)p.innerHTML=h}
function hideOv(){$$('#ov .cf').forEach(function(c){c.parentNode.removeChild(c)});remC($('#ov'),'on')}
function show(id){
  token++;cur=id;hideOv();
  $$('.screen').forEach(function(s){if(s.id===id)addC(s,'on');else remC(s,'on')});
}
function tooLong(){return new Date().getTime()-startedAt>REST_MS}
function showRest(){show('rest');say('خلصنا النهارده يا مراد. نشوفك بكرة');focusEl($('#rest .f'))}
function go(id){
  if(id!=='home'&&tooLong()){showRest();return}
  show(id);
  if(id==='memory')startMemory(0);
  else if(id==='shapes')startShapes();
  else if(id==='count')startCount();
  else if(id==='letters')startLetters();
  else focusEl($('#home .tile'));
}
function finish(game,gain){
  ovGame=game;
  $('#ov .gain').textContent=toAr(gain);
  var ov=$('#ov'),i,c,cols=['#FFD23F','#FF6B57','#2FC878','#7B5CFF','#49BDF5','#FF8FD0'];
  for(i=0;i<30;i++){
    c=document.createElement('i');c.className='cf';
    c.style.left=rnd(100)+'%';c.style.background=cols[rnd(6)];
    setAnim(c,(2.5+Math.random()*2.5)+'s',(Math.random()*1.2)+'s');
    ov.appendChild(c);
  }
  addC(ov,'on');sfx.win();say('برافو يا مراد! أنت شاطر أوي');
  focusEl($('#ov [data-act="again"]'));
}

/* ---------- memory game ---------- */
var SYMS=['apple','fish','star','heart','flower','sun'];
var MEM=[{p:3,cols:3,cw:14},{p:4,cols:4,cw:13},{p:6,cols:4,cw:10}];
var memL=0,opened=[],lock=false,matched=0,memTotal=0;
function startMemory(l){
  memL=l;var c=MEM[l];opened=[];lock=false;matched=0;memTotal=c.p;
  pips(3,l);setQ('لاقي الصورتين المتشابهتين');say('لاقي الصورتين المتشابهتين');
  var pick=shuffle(SYMS).slice(0,c.p),deck=shuffle(pick.concat(pick)),gap=1.8;
  var rows=Math.ceil(deck.length/c.cols),gw=c.cols*c.cw+(c.cols-1)*gap,gh=rows*c.cw+(rows-1)*gap,x0=(100-gw)/2,y0=19.5+(35.5-gh)/2,h='';
  deck.forEach(function(s,i){
    var r=Math.floor(i/c.cols),k=i%c.cols;
    h+='<button class="f card" data-sym="'+s+'" aria-label="كارت" style="left:'+(x0+k*(c.cw+gap))+'rem;top:'+(y0+r*(c.cw+gap))+'rem;width:'+c.cw+'rem;height:'+c.cw+'rem"><span class="front" style="font-size:'+(c.cw*.55)+'rem;line-height:'+c.cw+'rem">؟</span><span class="back">'+ic('s-'+s)+'</span></button>';
  });
  $('#memory .play').innerHTML=h;
  focusEl($('#memory .card'));
}
function flip(card){
  if(lock||has(card,'open')||has(card,'done'))return;
  addC(card,'open');sfx.flip();opened.push(card);
  if(opened.length<2)return;
  lock=true;var a=opened[0],b=opened[1],l=memL;opened=[];
  if(a.getAttribute('data-sym')===b.getAttribute('data-sym')){
    later(function(){
      addC(a,'done');addC(b,'done');sfx.good();praise();hop();matched++;lock=false;
      if(matched===memTotal){
        award();pips(3,l+1);
        if(l<2)later(function(){startMemory(l+1)},1500);else later(function(){finish('memory',3)},1000);
      }
    },550);
  }else{
    later(function(){remC(a,'open');remC(b,'open');lock=false},1000);
  }
}

/* ---------- colors & shapes ---------- */
var COL=[{id:'red',c:'#FF4B4B',m:'الأحمر',f:'الحمرا'},{id:'blue',c:'#3D8BFF',m:'الأزرق',f:'الزرقا'},{id:'yellow',c:'#FFC400',m:'الأصفر',f:'الصفرا'},{id:'green',c:'#2FB86B',m:'الأخضر',f:'الخضرا'}];
var SHP=[{id:'circle',n:'الدايرة',f:1},{id:'square',n:'المربع',f:0},{id:'triangle',n:'المثلث',f:0},{id:'star',n:'النجمة',f:1}];
var sRound=0,sKey='',busy=false;
function shapeSVG(id,c){
  var b={circle:'<circle cx="50" cy="50" r="40"/>',square:'<rect x="12" y="12" width="76" height="76" rx="10"/>',triangle:'<polygon points="50,12 90,86 10,86"/>',star:'<polygon points="50,6 61,37 94,38 68,58 78,91 50,72 22,91 32,58 6,38 39,37"/>'}[id];
  return '<svg viewBox="0 0 100 100"><g fill="'+c+'" stroke="'+c+'" stroke-width="8" stroke-linejoin="round">'+b+'</g></svg>';
}
function startShapes(){sRound=0;sNext()}
function sNext(){
  if(sRound>=5){finish('shapes',5);return}
  pips(5,sRound);busy=false;
  var tS=SHP[rnd(SHP.length)],tC=COL[rnd(COL.length)],easy=sRound<2,opts=[{s:tS,c:tC}],guard=0;
  sKey=tS.id+'-'+tC.id;
  while(opts.length<3&&guard++<60){
    var s=easy?tS:SHP[rnd(SHP.length)],c=COL[rnd(COL.length)],k=s.id+'-'+c.id,dup=false,j;
    for(j=0;j<opts.length;j++){if(opts[j].s.id+'-'+opts[j].c.id===k)dup=true}
    if(!dup)opts.push({s:s,c:c});
  }
  var h='';
  shuffle(opts).forEach(function(o,i){h+='<button class="f opt" data-k="'+o.s.id+'-'+o.c.id+'" style="left:'+(18.5+i*22)+'rem">'+shapeSVG(o.s.id,o.c.c)+'</button>'});
  $('#shapes .play').innerHTML=h;
  var q='فين '+tS.n+' '+(tS.f?tC.f:tC.m)+'؟';
  setQ(q);say(q);focusEl($('#shapes .opt'));
}
function pickShape(b){
  if(busy)return;
  if(b.getAttribute('data-k')===sKey){
    busy=true;addC(b,'good');sfx.good();praise();hop();award();sRound++;pips(5,sRound);later(sNext,1600);
  }else{
    addC(b,'no');sfx.bad();say(oops());setTimeout(function(){remC(b,'no')},600);
  }
}

/* ---------- counting ---------- */
var cRound=0,cAns=0;
function startCount(){cRound=0;cNext()}
function cNext(){
  if(cRound>=5){finish('count',5);return}
  pips(5,cRound);busy=false;
  var r=cRound<2?[1,4]:cRound<4?[3,7]:[5,10],n=r[0]+rnd(r[1]-r[0]+1),set=[n],g=0,i;
  cAns=n;
  while(set.length<3&&g++<60){var v=Math.max(1,Math.min(10,n+rnd(5)-2));if(set.indexOf(v)<0)set.push(v)}
  var per=n>6?5:n,rows=Math.ceil(n/per),ah=rows*8+(rows-1)*1.2,y0=(19-ah)/2,h='<div class="apanel">';
  for(i=0;i<n;i++){
    var row=Math.floor(i/per),cnt=Math.min(per,n-row*per),col=i-row*per,rw=cnt*8+(cnt-1)*1.2,x=(62-rw)/2+col*9.2,y=y0+row*9.2;
    h+='<div class="ap" style="left:'+x+'rem;top:'+y+'rem">'+ic('s-apple')+'<span class="lbl"></span></div>';
  }
  h+='</div>';
  var pal=shuffle([0,1,2,3]);
  shuffle(set).forEach(function(v,k){h+='<button class="f num n'+pal[k]+'" data-v="'+v+'" style="left:'+(29+k*15)+'rem">'+AR[v]+'</button>'});
  $('#count .play').innerHTML=h;
  setQ('عدّ التفاح معانا!');say('عدّ التفاح معانا');
  var aps=$$('#count .ap'),k=0;
  function step(){
    var a=aps[k];
    if(!a){setQ('كام تفاحة؟');say('كام تفاحة؟');return}
    addC(a,'pop');a.querySelector('.lbl').textContent=AR[k+1];sfx.tick(k);say(W[k+1]);k++;later(step,1000);
  }
  later(step,1700);
  focusEl($('#count .num'));
}
function pickNum(b){
  if(busy)return;
  if(+b.getAttribute('data-v')===cAns){
    busy=true;addC(b,'good');sfx.good();praise();hop();award();cRound++;pips(5,cRound);later(cNext,1700);
  }else{
    addC(b,'no');sfx.bad();say(oops());setTimeout(function(){remC(b,'no')},600);
  }
}

/* ---------- english letters ---------- */
var LET=[{L:'A',w:'Apple',s:'apple'},{L:'B',w:'Ball',s:'ball'},{L:'D',w:'Duck',s:'duck'},{L:'E',w:'Egg',s:'egg'},{L:'F',w:'Fish',s:'fish'},{L:'H',w:'Heart',s:'heart'},{L:'M',w:'Moon',s:'moon'},{L:'S',w:'Sun',s:'sun'}];
var LNAME={A:'ay',B:'bee',D:'dee',E:'ee',F:'eff',H:'aitch',M:'em',S:'ess'};
var lPic=true;
var LCOL=['#FF4B4B','#3D8BFF','#2FB86B','#F2A100','#7B5CFF'];
var lRound=0,lOrder=[],lT=null;
function startLetters(){lRound=0;lOrder=shuffle(LET).slice(0,5);lNext()}
function lNext(){
  if(lRound>=5){finish('letters',5);return}
  pips(5,lRound);busy=false;
  var t=lOrder[lRound],pic=lRound%2===0,opts=[t],g=0,c,dup,j;lT=t;lPic=pic;
  while(opts.length<3&&g++<60){
    c=LET[rnd(LET.length)];dup=false;
    for(j=0;j<opts.length;j++){if(opts[j].L===c.L)dup=true}
    if(!dup)opts.push(c);
  }
  var h='',cols=shuffle(LCOL);
  shuffle(opts).forEach(function(o,i){
    h+='<button class="f opt" data-k="'+o.L+'" style="left:'+(18.5+i*22)+'rem">'+(pic?ic('s-'+o.s):'<span class="ltr" style="color:'+cols[i]+'">'+o.L+'</span>')+'</button>';
  });
  h+='<div class="cap"><span></span></div>';
  $('#letters .play').innerHTML=h;
  if(pic){setQH('<span class="big">'+t.L+' '+t.L.toLowerCase()+'</span>');say(LNAME[t.L],'en')}
  else{setQH(ic('s-'+t.s));say(t.w,'en')}
  focusEl($('#letters .opt'));
}
function pickLetter(b){
  if(busy)return;
  if(b.getAttribute('data-k')===lT.L){
    busy=true;addC(b,'good');sfx.good();hop();award();lRound++;pips(5,lRound);
    var cap=$('#letters .cap');cap.style.display='block';cap.firstChild.textContent=lT.L+' for '+lT.w;
    say(lPic?lT.w:LNAME[lT.L],'en',2);later(lNext,3600);
  }else{
    addC(b,'no');sfx.bad();say(oops());setTimeout(function(){remC(b,'no')},600);
  }
}

/* ---------- input ---------- */
function setSound(on){
  soundOn=on;
  $$('.snd').forEach(function(b){if(on)remC(b,'off');else addC(b,'off')});
  if(!on&&window.speechSynthesis){try{speechSynthesis.cancel()}catch(e){}}
}
function greet(){if(greeted)return;greeted=true;ctx();say('أهلاً يا مراد! يلا نلعب')}
function target(el){
  while(el&&el.nodeType===1){
    if(el.getAttribute&&(el.getAttribute('data-go')||el.getAttribute('data-act')))return el;
    if(has(el,'card')||has(el,'opt')||has(el,'num'))return el;
    el=el.parentNode;
  }
  return null;
}
document.addEventListener('click',function(e){
  greet();
  var t=target(e.target||e.srcElement);
  if(!t)return;
  if(t.getAttribute('data-go'))return go(t.getAttribute('data-go'));
  var a=t.getAttribute('data-act');
  if(a==='home')return go('home');
  if(a==='again')return go(ovGame);
  if(a==='sound')return setSound(!soundOn);
  if(a==='reset'){startedAt=new Date().getTime();return go('home')}
  if(has(t,'card'))return flip(t);
  if(has(t,'opt'))return cur==='letters'?pickLetter(t):pickShape(t);
  if(has(t,'num'))return pickNum(t);
},false);
function focusables(){
  var scope=has($('#ov'),'on')?$('#ov'):$('.screen.on');
  return $$('.f',scope).filter(function(el){return !el.disabled&&el.offsetWidth>0});
}
function move(dx,dy){
  var list=focusables(),c=document.activeElement;
  if(!c||list.indexOf(c)<0){focusEl(list[0]);return}
  var r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,bs=1e9;
  list.forEach(function(el){
    if(el===c)return;
    var b=el.getBoundingClientRect(),ex=b.left+b.width/2-cx,ey=b.top+b.height/2-cy,along=ex*dx+ey*dy;
    if(along<=2)return;
    var across=dx?Math.abs(ey):Math.abs(ex),s=along+across*2;
    if(s<bs){bs=s;best=el}
  });
  focusEl(best);
}
document.addEventListener('keydown',function(e){
  var k=e.keyCode||e.which;greet();ctx();
  if(k===37){e.preventDefault();move(-1,0)}
  else if(k===39){e.preventDefault();move(1,0)}
  else if(k===38){e.preventDefault();move(0,-1)}
  else if(k===40){e.preventDefault();move(0,1)}
  else if(k===49||k===97){cycleMode()}
  else if(k===8||k===27||k===461||k===10009||k===10182||k===166){e.preventDefault();if(cur!=='home'&&cur!=='rest')go('home');else exitApp()}
  else if(k===13){var c=document.activeElement;if(!c||!has(c,'f')){focusEl(focusables()[0])}}
},false);

/* ---------- boot ---------- */
fit();window.addEventListener('resize',fit,false);
(function(){
  var m=null,q=location.search||'';
  try{m=localStorage.getItem('zaki_mode')}catch(e){}
  if(/shape=0/.test(q))m='0';else if(/shape=2/.test(q))m='2';else if(/shape=1/.test(q))m='1';
  MODE=m==='0'?0:m==='2'?2:1;
  if(MODE)shapeTree($('#stage'));
})();

setSound(true);refresh();
focusEl($('#home .tile'));
})();
</script>
